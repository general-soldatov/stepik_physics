- choice:
    question:
      types: choice
      text_data: Что называется магнитным полем?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - особая форма материи, посредством которой осуществляется взаимодействие между
        движущимися электрическими зарядами
      - силовое поле, действующее на движущиеся заряды и на проводники с током
      - вихревое поле, порождаемое электрическими токами и переменными электрическими
        полями
      wrong:
      - поле неподвижных электрических зарядов
      - гравитационное поле
      - поле, действующее только на постоянные магниты
- choice:
    question:
      types: choice
      text_data: Что характеризует вектор магнитной индукции $B$?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - силовую характеристику магнитного поля
      - силу, действующую со стороны поля на движущуюся заряженную частицу (силу Лоренца)
      - направление в каждой точке поля совпадает с направлением силы, действующей
        на северный полюс магнитной стрелки
      wrong:
      - энергетическую характеристику поля
      - потенциал поля
      - напряжённость электрического поля
