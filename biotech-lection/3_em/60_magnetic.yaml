- choice:
    question:
      types: choice
      text_data: Что называется напряжённостью магнитного поля H?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - векторная величина, характеризующая магнитное поле независимо от магнитных
        свойств среды
      - связана с магнитной индукцией соотношением $B = μ₀μH$
      - в вакууме $H = B/μ₀$
      wrong:
      - сила, действующая на единичный заряд
      - поток вектора B через поверхность
      - работа по перемещению магнитной массы
- choice:
    question:
      types: choice
      text_data: Что такое магнитный поток Φ?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - скалярная величина, равная произведению модуля вектора магнитной индукции
        на площадь поверхности и косинус угла между нормалью и вектором B
      - $Φ = B·S·cos α = ∫ B·dS$
      - измеряется в веберах (Вб)
      wrong:
      - произведение напряжённости на длину
      - сила, действующая на проводник
      - поток вектора H
- choice:
    question:
      types: choice
      text_data: Какими свойствами обладают линии магнитной индукции?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - замкнуты (не имеют начала и конца, вихревой характер поля)
      - не пересекаются
      - густота линий пропорциональна модулю вектора B
      wrong:
      - начинаются на положительных зарядах и заканчиваются на отрицательных
      - всегда прямолинейны
      - всегда параллельны друг другу
- choice:
    question:
      types: choice
      text_data: 'Правило левой руки для проводника с током позволяет определить:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - направление силы Ампера, действующей на проводник с током в магнитном поле
      wrong:
      - направление тока
      - направление магнитной индукции
      - величину силы тока
- choice:
    question:
      types: choice
      text_data: Как формулируется правило левой руки для проводника с током?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - если расположить левую руку так, чтобы линии магнитной индукции входили в
        ладонь, а четыре вытянутых пальца направить по току, то отставленный большой
        палец укажет направление силы, действующей на проводник
      wrong:
      - большой палец показывает направление тока
      - четыре пальца показывают направление силы
      - ладонь должна быть обращена в сторону движения проводника
