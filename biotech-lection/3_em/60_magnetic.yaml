      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Прямой провод с током
      - Круговой ток (виток)
      - Соленоид
      - Постоянный полосовой магнит
      - Правило буравчика
      second:
      - Концентрические окружности вокруг провода
      - Линии проходят через центр витка перпендикулярно плоскости
      - Внутри соленоида поле однородно, линии параллельны оси
      - Выходят из северного полюса, входят в южный (вне магнита)
