      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Вектор магнитной индукции B входит в ладонь
      - Четыре пальца левой руки направлены
      - Отогнутый большой палец показывает
      - Сила Ампера максимальна, если проводник расположен
      - Сила Ампера равна нулю, если проводник расположен
      second:
      - Условие применения правила ($B ⊥ ладони$)
      - по направлению тока
      - направление силы Ампера
      - перпендикулярно линиям индукции ($sinα = 1$)
      - параллельно линиям индукции ($sinα = 0$)
