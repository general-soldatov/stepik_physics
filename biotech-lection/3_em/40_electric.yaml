- choice:
    question:
      types: choice
      text_data: Что называется электрическим током?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - упорядоченное (направленное) движение электрически заряженных частиц
      - направленное движение свободных носителей заряда под действием электрического
        поля
      wrong:
      - хаотическое тепловое движение электронов
      - движение только электронов
      - движение только положительных ионов
- choice:
    question:
      types: choice
      text_data: 'За направление электрического тока условно принимают направление
        движения:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - положительных зарядов
      wrong:
      - отрицательных зарядов (электронов)
      - любых зарядов независимо от знака
      - ионов обоих знаков
- choice:
    question:
      types: choice
      text_data: Какие частицы могут быть носителями электрического тока в различных
        средах?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - электроны (в металлах)
      - ионы (в электролитах и газах)
      - дырки (в полупроводниках)
      wrong:
      - только электроны
      - только протоны
      - нейтроны
- choice:
    question:
      types: choice
      text_data: В каком направлении движутся электроны в металлическом проводнике
        при протекании тока?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - против условного направления тока (от «минуса» к «плюсу»)
      wrong:
      - по направлению тока (от «плюса» к «минусу»)
      - перпендикулярно току
      - беспорядочно
- choice:
    question:
      types: choice
      text_data: Какие условия необходимы для существования электрического тока в
        проводнике?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - наличие свободных носителей заряда
      - наличие электрического поля (разности потенциалов)
      - замкнутость электрической цепи
      wrong:
      - только наличие свободных электронов
      - только разность потенциалов без замкнутой цепи
      - отсутствие сопротивления
- choice:
    question:
      types: choice
      text_data: 'Сила тока I определяется как:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - отношение заряда, прошедшего через поперечное сечение проводника, ко времени
        прохождения
      - $I = Δq / Δt$
      - скалярная величина, измеряемая в амперах
      wrong:
      - произведение заряда на время
      - отношение времени к заряду
      - напряжение, делённое на сопротивление (это закон Ома, а не определение)
- choice:
    question:
      types: choice
      text_data: В каком направлении движутся положительные ионы в электролите под
        действием электрического поля?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - по направлению тока (к катоду — отрицательному электроду)
      wrong:
      - против направления тока
      - остаются неподвижными
      - движутся перпендикулярно току
- choice:
    question:
      types: choice
      text_data: Какой ток называют постоянным?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - ток, сила и направление которого не изменяются со временем
      - $I = const$
      wrong:
      - ток, меняющийся по синусоидальному закону
      - ток, существующий только в металлах
      - ток, который течёт только в одном направлении, но меняется по величине (это
        пульсирующий)
