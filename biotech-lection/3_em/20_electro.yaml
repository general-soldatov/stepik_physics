- choice:
    question:
      types: choice
      text_data: Что называется потенциалом электростатического поля φ в данной точке?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - отношение потенциальной энергии точечного заряда в поле к величине этого заряда
      - энергетическая характеристика поля, $φ = W_p / q$
      - работа по перемещению единичного положительного заряда из данной точки на
        бесконечность
      wrong:
      - сила, действующая на единичный заряд
      - работа по перемещению заряда по замкнутой траектории
      - производная напряжённости по координате
- choice:
    question:
      types: choice
      text_data: Какой физический смысл имеет разность потенциалов $Δφ = φ₁ - φ₂$?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - работа электростатического поля по перемещению единичного положительного заряда
        из точки 1 в точку 2
      - напряжение U
      - не зависит от пути перемещения (потенциальное поле)
      wrong:
      - сила, действующая на заряд
      - напряжённость, умноженная на расстояние
      - изменение кинетической энергии единичного заряда, взятое с обратным знаком
        — верно, но в поле консервативном, это эквивалентно
- choice:
    question:
      types: choice
      text_data: Какие утверждения об эквипотенциальных поверхностях верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - это поверхности, во всех точках которых потенциал имеет одинаковое значение
      - линии напряжённости перпендикулярны эквипотенциальным поверхностям
      - работа поля при перемещении заряда по эквипотенциальной поверхности равна
        нулю
      wrong:
      - эквипотенциали всегда являются плоскостями
      - линии напряжённости параллельны эквипотенциальным поверхностям
      - внутри проводника эквипотенциали не существуют
- choice:
    question:
      types: choice
      text_data: Что означает принцип аддитивности для потенциала?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - потенциал поля системы зарядов равен алгебраической (скалярной) сумме потенциалов,
        создаваемых каждым зарядом в отдельности
      - φ = φ₁ + φ₂ + ...
      wrong:
      - потенциал — векторная сумма
      - потенциал не подчиняется принципу суперпозиции
      - потенциал умножается на число зарядов
- choice:
    question:
      types: choice
      text_data: Как связаны напряжённость E и потенциал φ для электростатического
        поля?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $E = -grad φ$ (вектор направлен в сторону убывания потенциала)
      - $E_x = - ∂φ/∂x,\ E_y = - ∂φ/∂y,\ E_z = - ∂φ/∂z$
      - разность потенциалов между двумя точками равна ∫ E·dl (с обратным знаком)
      wrong:
      - $E = grad φ$
      - E = φ / r
      - E = const при φ = const
- choice:
    question:
      types: choice
      text_data: Что называется электрической индукцией D (электрическим смещением)
        в диэлектрике?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - вектор, связанный с напряжённостью E и поляризацией P соотношением $D = ε₀E
        + P$
      - в изотропном диэлектрике $D = ε₀·ε·E$
      - линии D начинаются и заканчиваются только на свободных зарядах
      wrong:
      - $D = E / ε$
      - D — это напряжённость поля в вакууме
      - D всегда равен нулю внутри проводника
- choice:
    question:
      types: choice
      text_data: Что такое «электростатический ветер»?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - движение ионов воздуха под действием электрического поля, возникающее у острия
        заряженного проводника
      - явление, приводящее к утечке заряда и созданию газового потока
      - используется в ионизаторах и электростатических двигателях
      wrong:
      - ветер, вызванный трением диэлектриков
      - результат действия магнитного поля на заряды
      - конвекция в жидкости под действием поля
- choice:
    question:
      types: choice
      text_data: Какие из перечисленных свойств присущи проводнику в электростатическом
        поле?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - потенциал внутри проводника одинаков (проводник эквипотенциален)
      - напряжённость поля внутри проводника равна нулю
      - вектор E перпендикулярен поверхности проводника
      wrong:
      - заряд внутри проводника может быть произвольным
      - линии напряжённости входят в проводник под любым углом
      - потенциал внутри проводника различен
- choice:
    question:
      types: choice
      text_data: Как связана работа электростатического поля с разностью потенциалов?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $A = q·(φ₁ - φ₂)$
      - $A = q·U$
      - работа не зависит от формы пути
      wrong:
      - $A = q·(φ₁ + φ₂)$
      - $A = q·E·d$
      - $A = -q·U$
- choice:
    question:
      types: choice
      text_data: 'Для точечного заряда q потенциал φ на расстоянии r равен:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $φ = (1/(4πε₀))·(q/r)$ (в СИ)
      - $φ = k·q/r$
      wrong:
      - $φ = k·q/r²$
      - $φ = q·r$
      - $φ = E·r$
