- choice:
    question:
      types: choice
      text_data: Какие свойства электрического заряда являются фундаментальными?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - заряд квантуется (существует минимальный элементарный заряд e ≈ 1.6·10⁻¹⁹
        Кл)
      - заряд инвариантен (не зависит от системы отсчёта)
      - выполняется закон сохранения электрического заряда
      wrong:
      - заряд непрерывен
      - заряд может быть сколь угодно малым
      - заряд зависит от скорости
- choice:
    question:
      types: choice
      text_data: 'Закон Кулона описывает силу взаимодействия:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - двух точечных неподвижных электрических зарядов
      - $F = k·|q1·q2|/r²$
      - направленную вдоль прямой, соединяющей заряды
      wrong:
      - только одинаковых зарядов
      - только разноимённых зарядов
      - зарядов, движущихся с большой скоростью
- choice:
    question:
      types: choice
      text_data: 'Единица измерения электрического заряда в СИ (кулон) — это:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - заряд, проходящий через поперечное сечение проводника при силе тока 1 А за
        1 с
      - 1 Кл = 1 А·с
      wrong:
      - заряд одного электрона
      - 1 Кл = 1 Н·м²/Кл²
      - 1 Кл = 1 В/м
- choice:
    question:
      types: choice
      text_data: Что называется напряжённостью электрического поля E?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - силовая характеристика поля, равная отношению силы, действующей на точечный
        заряд, к величине этого заряда
      - E = F / q
      - векторная величина, размерность В/м или Н/Кл
      wrong:
      - потенциальная энергия единичного заряда
      - работа по перемещению заряда
      - поток вектора через поверхность
- choice:
    question:
      types: choice
      text_data: Какие утверждения о силовых линиях электрического поля верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - начинаются на положительных зарядах и заканчиваются на отрицательных
      - густота линий пропорциональна напряжённости поля
      - не пересекаются
      wrong:
      - замкнуты сами на себя
      - всегда прямолинейны
      - начинаются на отрицательных зарядах и заканчиваются на положительных
- choice:
    question:
      types: choice
      text_data: Что характеризует электрический диполь?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - систему двух равных по модулю разноимённых точечных зарядов, находящихся на
        малом расстоянии друг от друга
      - имеет электрический дипольный момент p = q·l
      - плечо диполя l — вектор от отрицательного заряда к положительному
      wrong:
      - одиночный заряд
      - систему только положительных зарядов
      - заряды с одинаковым знаком
- choice:
    question:
      types: choice
      text_data: Что такое поляризация диэлектриков?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - процесс смещения связанных зарядов под действием внешнего электрического поля
      - возникновение дипольного момента у диэлектрика
      - в неполярных диэлектриках — индуцируется дипольный момент, в полярных — ориентация
        существующих диполей
      wrong:
      - появление свободных зарядов
      - проводимость диэлектрика
      - разрушение диэлектрика
- choice:
    question:
      types: choice
      text_data: 'Вектор поляризации P (поляризованность) — это:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - дипольный момент единицы объёма диэлектрика
      - $P = Σp_i / ΔV$
      - 'в слабых полях пропорционален напряжённости: $P = χ·ε0·E$'
      wrong:
      - напряжённость поля внутри диэлектрика
      - индукция электрического поля
      - поток вектора E
- choice:
    question:
      types: choice
      text_data: Чем отличаются полярные и неполярные диэлектрики?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - в полярных диэлектриках молекулы обладают собственным дипольным моментом (полярные
        молекулы)
      - в неполярных диэлектриках дипольный момент молекул равен нулю в отсутствие
        поля и индуцируется во внешнем поле
      - 'механизмы поляризации различны: ориентационный и электронный'
      wrong:
      - полярные проводят ток, а неполярные — нет
      - неполярные имеют большую диэлектрическую проницаемость
      - полярные диэлектрики не существуют
- choice:
    question:
      types: choice
      text_data: 'Теорема Гаусса для электрического поля в интегральной форме связывает:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - поток вектора напряжённости E через замкнутую поверхность с зарядом внутри
      - $∮ E·dS = q_{внутр} / ε_0$
      - 'поток вектора индукции D через замкнутую поверхность равен свободному заряду
        внутри: $∮ D·dS = q_{своб}$'
      wrong:
      - поток E с работой поля
      - $∮ E·dS = 0$ всегда
      - поток E с разностью потенциалов
