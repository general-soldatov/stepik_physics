      - устраняется диафрагмированием
      - наблюдается только в зеркалах
- choice:
    question:
      types: choice
      text_data: Что такое сферическая аберрация?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - искажение изображения, возникающее из-за того, что параксиальные и краевые
        лучи собираются в разных точках на оптической оси
      - лучи, падающие на линзу на разных расстояниях от оси, фокусируются на разных
        расстояниях
      wrong:
      - зависимость фокуса от цвета
      - изображение, даваемое плоским зеркалом
      - явление дифракции
