      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - обусловлена зависимостью показателя преломления от длины волны (дисперсией
        света)
      - различные цвета (длины волн) фокусируются линзой в разных точках
      - проявляется в виде цветных окантовок изображения
      wrong:
