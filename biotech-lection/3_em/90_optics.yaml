- choice:
    question:
      types: choice
      text_data: 'Уравнение Эйнштейна для фотоэффекта имеет вид:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $h·ν = A_{вых} + (m·v²_max)/2$
      - энергия фотона расходуется на работу выхода и сообщение кинетической энергии
        электрону
      wrong:
      - $h·ν = A_{вых} - E_{кин}$
      - $E_{кин} = h·ν$
      - $h·ν = m·v²/2$
- choice:
    question:
      types: choice
      text_data: Что такое красная граница фотоэффекта?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - минимальная частота (или максимальная длина волны) света, при которой ещё
        возможен фотоэффект для данного вещества
      - $ν_{кр} = A_{вых} / h$
      - $λ_{кр} = h·c / A_{вых}$
      wrong:
      - частота, при которой фототок максимален
      - граница спектра, где фотоэффект запрещён
      - частота, при которой работа выхода равна нулю
- choice:
    question:
      types: choice
      text_data: Какие законы фотоэффекта были установлены экспериментально (Столетовым
        и др.)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - сила фототока насыщения пропорциональна интенсивности падающего света
      - максимальная кинетическая энергия фотоэлектронов линейно растёт с частотой
        света и не зависит от интенсивности
      - существует красная граница фотоэффекта
      - фотоэффект безынерционен (время запаздывания < 10⁻⁹ с)
      wrong:
      - кинетическая энергия фотоэлектронов пропорциональна интенсивности света
      - красная граница не зависит от материала
      - фотоэффект наблюдается только при ультрафиолетовом излучении
- choice:
    question:
      types: choice
      text_data: Что такое работа выхода A_вых?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - минимальная энергия, которую необходимо сообщить электрону для его удаления
        из твёрдого тела или жидкости в вакуум
      - зависит от химической природы вещества и состояния поверхности
      wrong:
      - энергия, выделяющаяся при рекомбинации электрона с ионом
      - кинетическая энергия электрона внутри металла
      - энергия фотона
- choice:
    question:
      types: choice
      text_data: Как зависит задерживающее напряжение $U_з$ от частоты падающего света
        при фотоэффекте?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $U_з$ линейно растёт с частотой ν
      - $e·U_з = h·ν - A_{вых}$
      - $U_з = (h/e)·ν - A_{вых}/e$
      wrong:
      - $U_з$ не зависит от частоты
      - $U_з$ обратно пропорциональна ν
      - $U_з$ пропорциональна квадрату частоты
- choice:
    question:
      types: choice
      text_data: Что происходит с фототоком насыщения при увеличении интенсивности
        падающего света (при фиксированной частоте выше красной границы)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - фототок насыщения увеличивается пропорционально интенсивности
      - количество выбиваемых фотоэлектронов растёт
      wrong:
      - фототок насыщения не изменяется
      - фототок насыщения уменьшается
      - фототок насыщения исчезает
- choice:
