      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - U_з линейно растёт с частотой ν
      - e·U_з = h·ν - A_вых
      - U_з = (h/e)·ν - A_вых/e
      wrong:
      - U_з не зависит от частоты
      - U_з обратно пропорциональна ν
      - U_з пропорциональна квадрату частоты
