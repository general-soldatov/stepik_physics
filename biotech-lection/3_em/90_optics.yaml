- choice:
    question:
      types: choice
      text_data: Что называется фотоэлектрическим эффектом (фотоэффектом)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - испускание электронов веществом под действием падающего света (или любого
        электромагнитного излучения)
      - вырывание электронов из твёрдого тела или жидкости под действием фотонов
      wrong:
      - нагревание вещества светом
      - излучение света веществом при бомбардировке электронами
      - отражение света от поверхности металла
