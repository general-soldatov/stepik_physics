- choice:
    question:
      types: choice
      text_data: Почему классическая электродинамика не смогла объяснить законы фотоэффекта?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - она предсказывала зависимость кинетической энергии электронов от интенсивности
        света (а не от частоты)
      - она предсказывала большое время запаздывания (накопление энергии)
      - она не могла объяснить существование красной границы
      wrong:
      - она противоречила закону сохранения энергии
      - она запрещала существование фотонов
      - она не описывала корпускулярные свойства света
