- choice:
    question:
      types: choice
      text_data: Какие утверждения о сферическом (шаровом) конденсаторе верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - состоит из двух концентрических сферических обкладок
      - ёмкость сферического конденсатора $C = 4πε₀ε·(R₁·R₂)/(R₂ - R₁)$
      - при R₂ → ∞ ёмкость стремится к ёмкости уединённого шара радиуса R₁
      wrong:
      - обкладки параллельны
      - ёмкость не зависит от радиуса обкладок
      - ёмкость равна ε₀·S/d
