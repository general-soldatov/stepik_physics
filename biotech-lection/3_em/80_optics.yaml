- choice:
    question:
      types: choice
      text_data: Что называется интерференцией света?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - явление наложения когерентных световых волн, приводящее к устойчивому во времени
        распределению интенсивности (максимумы и минимумы)
      - перераспределение световой энергии в пространстве
      wrong:
      - огибание светом препятствий
      - зависимость скорости света от направления
      - преломление света на границе раздела сред
- choice:
    question:
      types: choice
      text_data: Какие условия необходимы для наблюдения интерференции света?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - волны должны быть когерентными (постоянная разность фаз)
      - волны должны иметь одинаковую (или близкую) частоту
      - волны должны быть поляризованы в одной плоскости (для интерференции от обычных
        источников)
      wrong:
      - волны должны быть монохроматическими (строго одна частота) – для устойчивой
        картины да, но не обязательно для наблюдения
      - источники должны быть точечными
      - волны должны быть поперечными
- choice:
    question:
      types: choice
      text_data: Что называется дифракцией света?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - огибание световыми волнами препятствий, соизмеримых с длиной волны
      - отклонение света от прямолинейного распространения
      - проникновение света в область геометрической тени
      wrong:
      - сложение волн
      - разложение белого света в спектр
      - отражение света
- choice:
    question:
      types: choice
      text_data: Что такое дифракционная решётка?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - оптический прибор, представляющий собой совокупность большого числа параллельных
        штрихов (щелей), нанесённых на прозрачную или отражающую поверхность
      - период решётки $d = a + b$ (a — ширина щели, b — ширина непрозрачного промежутка)
      wrong:
      - одна узкая щель
      - призма
      - линза с переменным фокусным расстоянием
- choice:
    question:
      types: choice
      text_data: 'Условие главных максимумов для дифракционной решётки (при нормальном
        падении света) имеет вид:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $d·sin φ = k·λ$, где k = 0, ±1, ±2, ...
      wrong:
      - $d·sin φ = (2k+1)·λ/2$
      - $d·sin φ = k·λ/2$
      - $d·sin φ = const$
- choice:
    question:
      types: choice
      text_data: Что называют плоскостью колебаний (в поляризации)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - плоскость, в которой колеблется электрический вектор E световой волны (иногда
        определяют как плоскость, содержащую E и направление распространения)
      wrong:
      - плоскость, перпендикулярная направлению распространения
      - плоскость, в которой колеблется магнитный вектор H
      - плоскость, в которой распространяется волна
- choice:
    question:
      types: choice
      text_data: Что называют плоскостью поляризации?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - плоскость, перпендикулярная плоскости колебаний (содержащую магнитный вектор
        H и направление распространения)
      - в ряде учебников — плоскость, в которой колеблется вектор E, но исторически
        сложилось иначе
      wrong:
      - плоскость, в которой распространяется волна
      - плоскость, перпендикулярная лучу
      - то же самое, что и плоскость колебаний – зависит от соглашения
- choice:
    question:
      types: choice
      text_data: Какие типы поляризации света существуют?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - естественный (неполяризованный)
      - частично поляризованный
      - плоскополяризованный (линейно поляризованный)
      - эллиптически и циркулярно поляризованный
      wrong:
      - только плоскополяризованный
      - только естественный
      - монохроматический
- choice:
    question:
      types: choice
      text_data: Что такое поляроид?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - плёнка или пластина, пропускающая свет только одной поляризации (плоскополяризованный
        свет)
      - устройство для получения и анализа поляризованного света
      - основан на явлении дихроизма
      wrong:
      - линза для фокусировки
      - зеркало
      - дифракционная решётка
- choice:
    question:
      types: choice
      text_data: Что характеризует угол Брюстера (угол полной поляризации)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - угол падения, при котором отражённый от диэлектрика свет становится полностью
        плоскополяризованным (перпендикулярно плоскости падения)
      - $tg α_Бр = n₂/n₁$ (для падения из первой среды во вторую)
      - преломлённый луч при этом поляризован частично
      wrong:
      - угол полного внутреннего отражения
      - угол, при котором преломлённый свет максимально поляризован
      - угол, при котором отражённый свет отсутствует
