- choice:
    question:
      types: choice
      text_data: Как связаны молярные теплоёмкости $C_p$ и $C_V$ с коэффициентом Пуассона
        γ и универсальной газовой постоянной R?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $C_V = R/(γ - 1)$
      - $C_p = γ·R/(γ - 1)$
      wrong:
      - $C_V = γ·R/(γ - 1)$
      - $C_p = R/(γ - 1)$
      - $C_V = R·γ$
      - $C_p = R·γ$
