- choice:
    question:
      types: choice
      text_data: Какое соотношение выражает уравнение Майера?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $C_p - C_V = R$ (молярные теплоёмкости)
      - $c_p - c_V = R/M$ (удельные теплоёмкости)
      - $C_p = C_V + R$
      wrong:
      - $C_p + C_V = R$
      - $C_p / C_V = R$
      - $C_p = C_V·R$
      - $C_V - C_p = R$
- choice:
    question:
      types: choice
      text_data: Каков физический смысл универсальной газовой постоянной R согласно
        уравнению Майера?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - R численно равна работе, совершаемой одним молем идеального газа при изобарном
        нагревании на 1 К
      - $R = p·V/T$ для одного моля
      - $R = N_A·k$
      wrong:
      - R — количество теплоты для нагрева 1 моля на 1 К при постоянном объёме
      - R — внутренняя энергия одного моля
      - R — давление одного моля при 0°C
- choice:
    question:
      types: choice
      text_data: Что называется коэффициентом Пуассона γ (гамма)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - отношение молярной теплоёмкости при постоянном давлении к молярной теплоёмкости
        при постоянном объёме
      - $γ = C_p / C_V$
      - $γ = c_p / c_V$
      wrong:
      - $γ = C_p - C_V$
      - $γ = C_V / C_p$
      - $γ = R / C_V$
      - $γ = C_p·C_V$
- choice:
    question:
      types: choice
      text_data: Какие значения коэффициента Пуассона γ характерны для идеальных газов?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - для одноатомного газа $γ = 5/3 ≈ 1,67$
      - для двухатомного газа (жёсткая молекула) $γ = 7/5 = 1,4$
      - для многоатомного нелинейного газа (при низких температурах) $γ ≈ 4/3 ≈ 1,33$
      wrong:
      - γ всегда равен 1
      - γ всегда больше 2
      - γ = 1,67 для всех газов
      - γ = 0,67
