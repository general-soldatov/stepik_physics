- choice:
    question:
      types: choice
      text_data: Какие из перечисленных скоростей характеризуют ансамбль молекул идеального
        газа в состоянии равновесия?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - наиболее вероятная скорость $v_вер$
      - средняя арифметическая скорость $<v>$
      - средняя квадратичная скорость $v_{кв}$
      wrong:
      - мгновенная скорость одной молекулы
      - скорость звука в газе
      - первая космическая скорость
- choice:
    question:
      types: choice
      text_data: Какое соотношение между средней квадратичной $v_{кв}$, средней арифметической
        $<v>$ и наиболее вероятной $v_{вер}$ скоростями для максвелловского распределения
        является верным?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $v_{кв} > <v> > v_{вер}$
      wrong:
      - $v_{вер} > <v> > v_{кв}$
      - $<v> > v_{кв} > v_{вер}$
      - $v_{кв} = <v> = v_{вер}$
      - $v_{вер} > v_{кв} > <v>$
