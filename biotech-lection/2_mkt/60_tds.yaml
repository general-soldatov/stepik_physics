- matching:
    question:
      types: matching
      text_data: 'Сопоставьте процесс с изменением энтропии (для изолированной системы
        или вселенной в целом):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Обратимый адиабатный процесс
      - Необратимое расширение газа в пустоту
      - Теплопередача от горячего тела к холодному (конечная разность температур)
      - Равновесный изотермический процесс (обратимый)
      - Смешение двух различных газов
      second:
      - $ΔS = 0$ (изоэнтропийный процесс)
      - $ΔS > 0$ (возрастает)
      - $ΔS > 0$ (суммарная энтропия возрастает)
      - 'ΔS может быть больше нуля или меньше? При обратимом изотермическом: ΔS =
        Q/T, но система не изолирована; вселенная: ΔS_всел = 0'
      - $ΔS > 0$ (энтропия смешения)
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте понятие с его характеристикой (в контексте «обесцененности»
        энергии):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Полезная работа (максимальная)
      - Теплота при температуре окружающей среды
      - Градиент температур
      - Выравнивание температур
      - Связанная энергия (T·S)
      second:
      - Может быть получена за счёт свободной энергии
      - Практически не может быть превращена в работу (низкопотенциальная энергия)
      - Позволяет получить работу (например, в тепловой машине)
      - Приводит к увеличению энтропии и «обесцениванию» энергии
      - Энергия, ставшая недоступной для совершения работы
