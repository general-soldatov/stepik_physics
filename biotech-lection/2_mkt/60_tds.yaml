- choice:
    question:
      types: choice
      text_data: Какие из формулировок выражают второй закон термодинамики?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Невозможно перевести теплоту от более холодного тела к более горячему без
        совершения работы (Клаузиус)
      - Невозможно создать вечный двигатель второго рода (Томсон, Планк)
      - Энтропия изолированной системы не убывает (ΔS ≥ 0)
      wrong:
      - Энергия не может быть создана или уничтожена
      - Сумма кинетической и потенциальной энергии постоянна
      - Давление идеального газа обратно пропорционально объёму при постоянной температуре
- choice:
    question:
      types: choice
      text_data: Что называют вечным двигателем второго рода?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - гипотетическое устройство, которое полностью превращает теплоту, отобранную
        от одного источника, в работу без каких-либо изменений в окружающей среде
      - устройство с коэффициентом полезного действия 100% (или более) для тепловой
        машины, работающей по циклу
      wrong:
      - устройство, нарушающее первый закон термодинамики (вечный двигатель первого
        рода)
      - устройство, работающее без трения
      - машина, преобразующая внутреннюю энергию в механическую с КПД меньше 100%
- choice:
    question:
      types: choice
      text_data: Что такое энтропия S?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - функция состояния термодинамической системы
      - мера беспорядка (хаотичности) системы
      - $dS ≥ δQ/T$ (для замкнутых систем dS ≥ 0)
      wrong:
      - количество теплоты в системе
      - полная энергия системы
      - температура, умноженная на объём
- choice:
    question:
      types: choice
      text_data: Как связано изменение энтропии с обратимым и необратимым процессами?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - в обратимом процессе изменение энтропии $dS = δQ_{обр}/T$
      - в необратимом процессе энтропия изолированной системы возрастает ($dS > 0$)
      - в обратимом адиабатном процессе энтропия постоянна (изоэнтропийный процесс)
      wrong:
      - в любом процессе энтропия убывает
      - в обратимом процессе энтропия максимальна
      - необратимые процессы не влияют на энтропию
- choice:
    question:
      types: choice
      text_data: Что такое связанная энергия системы?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - часть внутренней энергии, которая не может быть превращена в работу (особенно
        в изотермическом процессе)
      - произведение температуры на энтропию (T·S)
      - энергия, «обесцененная» из-за необратимости процессов
      wrong:
      - кинетическая энергия молекул
      - потенциальная энергия взаимодействия
      - энергия, которую можно полностью превратить в работу
- choice:
    question:
      types: choice
      text_data: В каком смысле говорят об «обесцененности» энергии?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - в необратимых процессах часть энергии переходит в форму, менее пригодную для
        совершения работы (например, внутренняя энергия при выравнивании температур)
      - возрастание энтропии означает снижение работоспособности системы
      - энергия становится более «рассеянной»
      wrong:
      - энергия исчезает или уничтожается
      - энергия перестаёт подчиняться закону сохранения
      - энергия превращается в массу
- choice:
    question:
      types: choice
      text_data: Какие процессы ведут к увеличению энтропии изолированной системы?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - теплопередача от горячего тела к холодному
      - расширение газа в пустоту (необратимое расширение)
      - смешение двух разных газов диффузией
      wrong:
      - обратимое адиабатное расширение (энтропия постоянна)
- choice:
    question:
      types: choice
      text_data: Какие утверждения о внутренней энергии U и энтропии S верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - U и S — функции состояния
      - U характеризует энергию системы, S — степень беспорядка
      - при абсолютном нуле температуры энтропия идеального кристалла равна нулю (третий
        закон термодинамики)
      wrong:
      - S имеет размерность энергии
      - U всегда больше TS
      - энтропия не может быть вычислена, только измерена
- choice:
    question:
      types: choice
      text_data: Что происходит со свободной энергией в необратимых процессах в изолированной
        системе?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - свободная энергия уменьшается (стремится к минимуму при равновесии)
      - потеря свободной энергии равна приросту связанной энергии ($ΔF = -T·ΔS_{произв}$)
      wrong:
      - свободная энергия возрастает
      - свободная энергия остаётся постоянной
      - свободная энергия превращается в теплоту
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте термин с его определением:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Второй закон термодинамики
      - Энтропия S
      - Вечный двигатель второго рода
      - Свободная энергия (Гельмгольца)
      - Связанная энергия
      second:
      - Закон, устанавливающий направление тепловых процессов и возрастание энтропии
        в изолированных системах
      - Мера беспорядка (статистический вес) системы, функция состояния
      - Устройство, которое полностью превращает теплоту в работу (КПД=100%), что
        невозможно
      - $F = U - TS$, часть внутренней энергии, способная превратиться в работу при
        T = const
      - T·S, часть внутренней энергии, не способная превратиться в работу (особенно
        в изотермических процессах)
