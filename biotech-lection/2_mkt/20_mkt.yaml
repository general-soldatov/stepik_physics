- choice:
    question:
      types: choice
      text_data: Что изучает молекулярная физика?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - строение и свойства вещества на основе молекулярно-кинетических представлений
      - тепловые явления и их связь с движением молекул
      - свойства макроскопических систем
      wrong:
      - только механическое движение тел
      - электрические поля в вакууме
      - ядерные реакции
- choice:
    question:
      types: choice
      text_data: Какие утверждения о статистическом и термодинамическом методах верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - статистический метод оперирует средними значениями величин, характеризующих
        ансамбль частиц
      - термодинамический метод не рассматривает молекулярное строение, а использует
        макроскопические параметры
      - статистический метод позволяет вычислить макроскопические характеристики на
        основе микроскопических моделей
      wrong:
      - термодинамический метод основан на рассмотрении каждой молекулы в отдельности
      - статистический метод не использует вероятности
      - оба метода полностью исключают друг друга и не связаны
- choice:
    question:
      types: choice
      text_data: Какие системы называются термодинамическими?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - макроскопические системы, которые могут обмениваться энергией и/или веществом
        с окружающей средой
      - совокупность большого числа частиц, подчиняющихся законам термодинамики
      wrong:
      - системы, состоящие из одной-единственной молекулы
      - только изолированные системы
      - системы, находящиеся только в вакууме
- choice:
    question:
      types: choice
      text_data: Как классифицируются термодинамические системы по характеру обмена
        с внешними телами?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - открытые (обмен веществом и энергией)
      - закрытые (обмен энергией, но не веществом)
      - адиабатные (нет обмена теплом, но возможен обмен работой)
      - изолированные (нет обмена ни веществом, ни энергией)
      wrong:
      - только закрытые и открытые
      - только изолированные
      - только адиабатные
- choice:
    question:
      types: choice
      text_data: Что такое термодинамические параметры?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - величины, характеризующие состояние термодинамической системы (давление, объём,
        температура, и т.д.)
      - бывают внешние (например, объём в поле тяжести) и внутренние (например, энергия)
      wrong:
      - только температура
      - только давление и объём
      - параметры, которые нельзя измерить
- choice:
    question:
      types: choice
      text_data: Какие утверждения о температуре верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - температура – мера средней кинетической энергии теплового движения молекул
      - температура – термодинамический параметр, характеризующий степень нагретости
        тела
      - в системе с тепловым равновесием температура одинакова во всех частях
      wrong:
      - температура не связана с движением молекул
      - температура может быть отрицательной только по шкале Цельсия (да, но и по
        Кельвину формально возможна в особых системах, но не в классической теории)
      - температура – это количество теплоты
- choice:
    question:
      types: choice
      text_data: Как связаны температура по шкале Цельсия (t) и термодинамическая
        температура (T)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - T (К) = t (°C) + 273,15
      - размер градуса одинаков для обеих шкал
      - 0 °C соответствует 273,15 К
      wrong:
      - T = t - 273,15
      - 0 К = 0 °C
      - градус Цельсия больше кельвина
- choice:
    question:
      types: choice
      text_data: Что называется равновесным состоянием термодинамической системы?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - состояние, в котором термодинамические параметры не меняются со временем (в
        отсутствие внешних воздействий)
      - состояние, в котором нет потоков (тепла, вещества, импульса)
      wrong:
      - состояние с максимальной энтропией (для замкнутой – да, но это следствие)
      - состояние, в котором система обязательно изолирована
      - состояние, когда все молекулы остановились
- choice:
    question:
      types: choice
      text_data: Какие из перечисленных систем являются изолированными (в строгом
        термодинамическом смысле)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - система, не обменивающаяся с окружающей средой ни веществом, ни энергией (в
        любой форме)
      - идеализация, реально не существующая
      - термос с идеальной теплоизоляцией и абсолютно жёсткими стенками (приближённо)
      wrong:
      - открытая система
      - система в термостате
      - система, обменивающаяся только работой
- choice:
    question:
      types: choice
      text_data: Что такое термодинамический процесс?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - изменение состояния термодинамической системы во времени
      - переход из одного равновесного состояния в другое
      - может быть равновесным (квазистатическим) и неравновесным
      wrong:
      - только процесс, происходящий при постоянной температуре
      - только адиабатный процесс
      - мгновенное изменение параметров
