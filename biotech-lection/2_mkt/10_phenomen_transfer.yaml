- choice:
    question:
      types: choice
      text_data: Какие процессы относятся к явлениям переноса в физике?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - диффузия (перенос массы)
      - теплопроводность (перенос внутренней энергии)
      - вязкость (перенос импульса)
      wrong:
      - электромагнитная индукция
      - фотоэффект
      - поляризация диэлектриков
- choice:
    question:
      types: choice
      text_data: Что переносится при диффузии?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - масса вещества
      - молекулы (или атомы, ионы) примеси
      - концентрация выравнивается
      wrong:
      - тепловая энергия (это теплопроводность)
      - импульс (это вязкость)
      - электрический заряд (в отсутствие поля)
- choice:
    question:
      types: choice
      text_data: Что характеризует длина свободного пробега λ молекулы?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - среднее расстояние, которое молекула проходит между двумя последовательными
        столкновениями
      - λ = 1/(√2 * n * π * d²)
      - зависит от концентрации молекул и эффективного диаметра
      wrong:
      - максимальное расстояние от источника
      - диаметр молекулы
      - длина сосуда
- choice:
    question:
      types: choice
      text_data: Какие силы называются когезионными?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - силы взаимодействия между молекулами (атомами, ионами) внутри одного и того
        же вещества
      - силы, обеспечивающие прочность твёрдого тела и поверхностное натяжение жидкости
      wrong:
      - силы взаимодействия между молекулами разных веществ (это адгезия)
      - силы трения
      - гравитационные силы
- choice:
    question:
      types: choice
      text_data: Какие утверждения о смачивании и несмачивании верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - смачивание наблюдается, когда силы адгезии больше сил когезии
      - вода смачивает чистое стекло (краевой угол острый)
      - ртуть не смачивает стекло (краевой угол тупой)
      wrong:
      - жидкость всегда смачивает твёрдое тело
      - смачивание не зависит от материала поверхности
      - при полном смачивании краевой угол равен 180°
- choice:
    question:
      types: choice
      text_data: Что такое капиллярные явления?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - поднятие или опускание жидкости в тонких трубках (капиллярах) под действием
        сил поверхностного натяжения
      - высота подъёма $h = (2σ·cosθ)/(ρ·g·r)$
      wrong:
      - кипение жидкости
      - испарение с поверхности
      - диффузия в порах
- choice:
    question:
      types: choice
      text_data: Каковы признаки ламинарного течения жидкости?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - слоистое течение без перемешивания
      - частицы движутся по параллельным траекториям
      - наблюдается при малых скоростях и/или большой вязкости
      wrong:
      - хаотическое движение вихрей
      - перемешивание слоёв
      - зависимость сопротивления от квадрата скорости (в основном)
- choice:
    question:
      types: choice
      text_data: Какие утверждения о турбулентном движении верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - происходит интенсивное перемешивание жидкости (газа)
      - скорость в каждой точке хаотически пульсирует
      - возникает при превышении критического числа Рейнольдса
      wrong:
      - отсутствует сопротивление движению
      - все частицы движутся по прямым линиям
      - наблюдается только в вязких жидкостях при малых скоростях
- choice:
    question:
      types: choice
      text_data: Что называется мениском?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - искривлённая поверхность жидкости в узкой трубке (капилляре) или у стенки
        сосуда
      - вогнутый мениск образуется у смачивающей жидкости
      - выпуклый мениск – у несмачивающей жидкости
      wrong:
      - плоская поверхность жидкости
      - пузырёк газа в жидкости
      - уровень жидкости в широком сосуде
- choice:
    question:
      types: choice
      text_data: Какие вещества называют поверхностно-активными (ПАВ)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - вещества, которые понижают поверхностное натяжение жидкости, концентрируясь
        на поверхности
      - например, мыло, спирты, жирные кислоты
      wrong:
      - вещества, повышающие поверхностное натяжение (например, соли в воде)
      - вещества, не растворяющиеся в жидкости
      - вещества, разрушающие капилляры
