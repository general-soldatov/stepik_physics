- choice:
    question:
      types: choice
      text_data: Что изучает термодинамика?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - законы превращения энергии в макроскопических системах
      - тепловые процессы без рассмотрения молекулярного строения тел
      - условия равновесия и направления тепловых процессов
      wrong:
      - движение отдельных молекул
      - электромагнитные поля
      - строение атомного ядра
- choice:
    question:
      types: choice
      text_data: Что такое внутренняя энергия термодинамической системы?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - суммарная кинетическая энергия хаотического движения частиц и потенциальная
        энергия их взаимодействия
      - полная энергия системы за вычетом кинетической энергии движения системы как
        целого и потенциальной энергии во внешних полях
      - функция состояния системы
      wrong:
      - только кинетическая энергия молекул
      - только потенциальная энергия взаимодействия
      - энергия, которую система может передать в виде работы
- choice:
    question:
      types: choice
      text_data: Какими способами термодинамическая система может обмениваться энергией
        с внешними телами?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - совершая работу
      - путём теплообмена (передачи теплоты)
      wrong:
      - только за счёт изменения объёма
      - только при фазовых переходах
      - путём изменения массы системы
- choice:
    question:
      types: choice
      text_data: Как формулируется первый закон термодинамики?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - изменение внутренней энергии системы равно сумме количества теплоты, переданного
        системе, и работы, совершённой над системой
      - $ΔU = Q + A_{над}$
      - $ΔU = Q - A_{сов}$ (где $A_{сов}$ — работа, совершённая системой)
      wrong:
      - $ΔU = Q$
      - $ΔU = A$
      - теплота не может полностью превратиться в работу
- choice:
    question:
      types: choice
      text_data: Что называется теплоёмкостью тела?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - количество теплоты, необходимое для нагревания тела на 1 К (или 1 °C)
      - $C = Q/ΔT$
      - экстенсивная величина (зависит от массы)
      wrong:
      - количество теплоты, необходимое для плавления
      - температура тела
      - удельная теплоёмкость, умноженная на объём
- choice:
    question:
      types: choice
      text_data: Какое соотношение связывает удельную теплоёмкость $c$ и молярную теплоёмкость
        $C_m$?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $C_m = c·M$ (где M — молярная масса)
      - $c = C_m / M$
      wrong:
      - $C_m = c / M$
      - $C_m = c·m$
      - $C_m = c·N_A$
- choice:
    question:
      types: choice
      text_data: 'Для идеального одноатомного газа молярная теплоёмкость при постоянном
        объёме $C_V$ равна:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $C_V = (3/2)·R$
      wrong:
      - $C_V = (5/2)·R$
      - $C_V = (3/2)·k$
      - $C_V = (3/2)·R·T$
      - $C_V = R$
- choice:
    question:
      types: choice
      text_data: Какие из перечисленных процессов происходят с совершением работы
        газом?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - расширение газа при постоянном давлении
      - адиабатное расширение
      - изотермическое расширение
      wrong:
      - охлаждение газа в жёстком сосуде (dV=0)
      - изохорный нагрев
      - конденсация пара в вакууме
- choice:
    question:
      types: choice
      text_data: Какие утверждения о работе газа верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - работа газа при расширении положительна
      - элементарная работа $δA = p·dV$
      - работа численно равна площади под кривой p(V)
      wrong:
      - работа не зависит от процесса, а только от начального и конечного состояний
      - работа газа всегда равна Q
      - работа газа при любом процессе равна нулю
- choice:
    question:
      types: choice
      text_data: Для каких процессов количество теплоты Q равно изменению внутренней
        энергии ΔU?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - изохорный процесс (V = const → A = 0, Q = ΔU)
      wrong:
      - изобарный процесс (Q = ΔU + pΔV)
      - изотермический процесс (ΔU = 0, Q = A)
      - адиабатный процесс (Q = 0, ΔU = -A)
