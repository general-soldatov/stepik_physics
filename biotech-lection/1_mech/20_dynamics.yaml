- choice:
    question:
      types: choice
      text_data: Какие системы отсчёта являются инерциальными согласно первому закону
        Ньютона?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - системы, движущиеся равномерно и прямолинейно относительно Земли (приближённо)
      - системы, в которых тело, на которое не действуют силы, покоится или движется
        равномерно и прямолинейно
      - системы, движущиеся с постоянной скоростью относительно другой инерциальной
        системы
      wrong:
      - системы, вращающиеся с постоянной угловой скоростью
      - системы, движущиеся с ускорением относительно звёзд
      - любые системы отсчёта без исключения
