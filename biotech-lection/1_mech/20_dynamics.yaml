- matching:
    question:
      types: matching
      text_data: 'Сопоставьте формулировку с законом Ньютона:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Первый закон Ньютона
      - Второй закон Ньютона (общая форма)
      - Второй закон Ньютона (классическая форма F=ma)
      - Третий закон Ньютона
      - Принцип относительности Галилея
      second:
      - Существуют инерциальные системы отсчёта, в которых тело сохраняет состояние
        покоя или равномерного прямолинейного движения до тех пор, пока внешнее воздействие
        не изменит это состояние
      - Скорость изменения импульса тела равна равнодействующей приложенных к нему
        сил ($F = dp/dt$)
      - Ускорение, приобретаемое телом, прямо пропорционально равнодействующей силе
        и обратно пропорционально массе тела
      - Силы, с которыми два тела действуют друг на друга, равны по модулю, противоположны
        по направлению и действуют вдоль одной прямой
      - Все механические явления протекают одинаково во всех инерциальных системах
        отсчёта
