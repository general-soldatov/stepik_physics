      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - сила гравитационного притяжения между Землёй и Луной
      - 'силы взаимодействия частиц внутри Земли, если мы рассматриваем её как систему
        частиц (уточнение: в рамках модели двух тел это только сила между телами)'
