- choice:
    question:
      types: choice
      text_data: Что называется кинетической энергией тела?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - энергия механического движения тела, равная $(m*v^2)/2$
      - способность тела совершать работу за счёт своего движения
      wrong:
      - энергия взаимодействия тел
      - произведение силы на перемещение
      - работа, совершённая телом за 1 секунду
- choice:
    question:
      types: choice
      text_data: Какие силы являются консервативными (потенциальными)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - сила тяжести
      - сила упругости пружины
      - гравитационная сила (по закону Ньютона)
      wrong:
      - сила трения скольжения
      - сила сопротивления воздуха
      - сила вязкого трения
- choice:
    question:
      types: choice
      text_data: Как формулируется закон сохранения механической энергии?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - в замкнутой системе тел, между которыми действуют только консервативные силы,
        полная механическая энергия сохраняется
      - сумма кинетической и потенциальной энергии системы остаётся постоянной, если
        работа внешних сил и сил трения равна нулю
      wrong:
      - энергия не может быть создана или уничтожена, только переходить из одной формы
        в другую (общий закон, но не конкретно механической)
      - работа всех сил равна изменению кинетической энергии
      - импульс системы сохраняется
- choice:
    question:
      types: choice
      text_data: Что характеризует коэффициент полезного действия (КПД)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - отношение полезной работы к полной (затраченной) работе
      - отношение полезной мощности к полной мощности
      - долю энергии, которая была использована по назначению
      wrong:
      - количество потерянной энергии
      - произведение полезной работы на время
      - всегда больше 1 (100%)
- choice:
    question:
      types: choice
      text_data: Как связаны консервативные силы и потенциальная энергия?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - работа консервативных сил равна убыли потенциальной энергии
      - $F = - grad(П)$
      - консервативная сила направлена в сторону наибольшего убывания потенциальной
        энергии
      wrong:
      - работа консервативных сил всегда положительна
      - потенциальная энергия не зависит от положения тела
      - консервативные силы всегда совершают работу по замкнутому контуру, не равную
        нулю
- choice:
    question:
      types: choice
      text_data: Что называется силовым полем?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - область пространства, в каждой точке которого на тело действует сила, зависящая
        от координат (и, возможно, времени)
      - поле, создаваемое консервативными силами
      wrong:
      - только гравитационное поле
      - только электрическое поле
      - область пространства, где тело движется без сил
- choice:
    question:
      types: choice
      text_data: Какие утверждения о потенциале (применительно к потенциальным полям)
        верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - потенциал – это скалярная величина
      - потенциальная энергия тела в поле равна произведению массы (или заряда) на
        потенциал
      - разность потенциалов определяет работу поля по перемещению тела
      wrong:
      - потенциал – это вектор
      - потенциал не зависит от положения точки в поле
      - потенциал измеряется в джоулях
- choice:
    question:
      types: choice
      text_data: 'Закон сохранения механической энергии НЕ выполняется, если в системе
        действуют:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - силы трения (неконсервативные диссипативные силы)
      - силы сопротивления
      - силы, приводящие к переходу механической энергии во внутреннюю (тепло)
      wrong:
      - сила тяжести
      - сила упругости
      - только консервативные силы
- choice:
    question:
      types: choice
      text_data: Какая связь между работой и изменением кинетической энергии точки?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - работа равнодействующей всех сил, приложенных к точке, равна изменению её
        кинетической энергии (теорема об изменении кинетической энергии)
      - работа = ΔE_кин
      wrong:
      - работа равна изменению импульса
      - работа равна изменению потенциальной энергии
      - работа всегда равна нулю для замкнутой траектории
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте понятие с его определением или формулой:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Кинетическая энергия
      - Потенциальная энергия (в поле тяжести вблизи Земли)
      - Потенциальная энергия упруго деформированной пружины
      - Работа силы
      - Мощность
      second:
      - $E_{кин} = m*v^2 / 2$
      - $E_{пот} = m*g*h$ (при малых h)
      - $E_{пот} = k*x^2 / 2$
      - $A = F * Δr * cos \alpha$ (скалярное произведение силы на перемещение)
      - $N = A / t$ (или $N = F * v$, если скорость и сила сонаправлены)
