      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Работа и энергия
      - Мощность
      - КПД (коэффициент полезного действия)
      - Потенциал (гравитационный, для m=1 кг)
      - Градиент потенциала (модуль)
      second:
      - Джоуль (Дж)
      - Ватт (Вт)
      - безразмерная величина (или %), иногда обозначается η
      - Дж/кг (в гравитации) или просто м²/с²
      - Н/кг (или м/с²) – ускорение свободного падения по модулю
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте физическую ситуацию с типом изменения энергии:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Свободное падение тела без трения
      - Скольжение тела по шероховатой горизонтальной поверхности (с постоянной скоростью)
      - Растяжение пружины (медленное, без ускорения)
      - Абсолютно неупругий удар двух тел
      - Работа двигателя, поднимающего груз с постоянной скоростью
      second:
      - Переход потенциальной энергии в кинетическую (полная механическая сохраняется)
      - Работа силы тяги (или толчка) полностью превращается в тепло (механическая
        энергия не сохраняется)
      - Работа внешней силы переходит в потенциальную энергию упругой деформации
      - Кинетическая энергия частично (или полностью) переходит во внутреннюю (и,
        возможно, в потенциальную энергию деформации)
      - Химическая/электрическая энергия (через работу двигателя) переходит в потенциальную
        энергию груза (и частично в тепло из-за КПД < 1)
