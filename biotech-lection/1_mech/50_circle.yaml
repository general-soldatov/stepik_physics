- choice:
    question:
      types: choice
      text_data: Какие из перечисленных характеристик относятся к вращательному движению
        твёрдого тела?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - угловая скорость
      - угловое ускорение
      - момент инерции
      - момент силы
      wrong:
      - масса (как абсолютная величина)
      - импульс (линейный)
      - сила (без привязки к плечу)
- choice:
    question:
      types: choice
      text_data: Какие утверждения о центростремительном и тангенциальном ускорениях
        верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - центростремительное ускорение характеризует изменение скорости по направлению
        и направлено к центру окружности
      - тангенциальное ускорение характеризует изменение скорости по модулю и направлено
        по касательной к траектории
      - полное ускорение равно векторной сумме центростремительного и тангенциального
      wrong:
      - центростремительное ускорение меняет модуль скорости
      - тангенциальное ускорение всегда равно нулю при равномерном движении по окружности
      - центростремительное ускорение всегда больше тангенциального
- choice:
    question:
      types: choice
      text_data: Что называется моментом силы относительно полюса (точки)?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - векторная физическая величина, равная векторному произведению радиус-вектора
        точки приложения силы на силу
      - M = [r × F]
      - момент силы характеризует способность силы вращать тело
      wrong:
      - скалярное произведение силы на плечо
      - произведение силы на скорость
      - отношение силы к массе
- choice:
    question:
      types: choice
      text_data: 'Момент импульса материальной точки относительно полюса определяется
        как:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $L = [r × p]$ (векторное произведение радиус-вектора на импульс)
      - $L = r * m * v * sin α$
      - момент импульса сохраняется, если сумма моментов внешних сил равна нулю
      wrong:
      - $L = m * v$ (линейный импульс)
      - $L = I * ω$ (для твёрдого тела – да, но для материальной точки – частный случай)
      - $L = F * Δt$
- choice:
    question:
      types: choice
      text_data: Какие утверждения о моменте инерции верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - момент инерции – мера инертности тела во вращательном движении
      - момент инерции зависит от распределения массы относительно оси вращения
      - момент инерции – скалярная (в простейшем случае) величина, аддитивная
      wrong:
      - момент инерции не зависит от выбора оси
      - момент инерции измеряется в кг·м/с²
      - момент инерции всегда равен m·R² для любого тела
- choice:
    question:
      types: choice
      text_data: 'Теорема Штейнера-Гюйгенса утверждает:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - момент инерции относительно произвольной оси равен сумме момента инерции относительно
        параллельной оси, проходящей через центр масс, и произведения массы тела на
        квадрат расстояния между осями
      - $I = I_{цм} + m*d²$
      wrong:
      - $I = I_{цм} - m*d²$
      - момент инерции минимален для оси, проходящей через центр масс
      - $I = m*d²$
- choice:
    question:
      types: choice
      text_data: 'Закон сохранения момента импульса выполняется, когда:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - сумма моментов всех внешних сил относительно данной оси (или полюса) равна
        нулю
      - система изолирована (замкнута) или внешние силы не создают вращающего момента
      - пространство изотропно (следствие изотропности пространства)
      wrong:
      - сумма всех внешних сил равна нулю (это для импульса)
      - сохраняется механическая энергия
      - тело движется поступательно
- choice:
