      - Точка, относительно которой вычисляется момент силы (или момент импульса)
      - Свойство пространства, означающее, что все его точки равноправны (физические
        законы не зависят от выбора начала отсчёта)
      - Свойство пространства, означающее, что все направления в пространстве равноправны
      - Формула, позволяющая вычислить момент инерции относительно любой оси, если
        известен момент инерции относительно параллельной оси, проходящей через центр
