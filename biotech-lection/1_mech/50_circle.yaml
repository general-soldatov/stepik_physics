      text_data: 'Сопоставьте понятие с его определением:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Вращение твёрдого тела
      - Полюс (в контексте момента силы)
      - Однородность пространства
      - Изотропность пространства
      - Теорема Штейнера-Гюйгенса
      second:
