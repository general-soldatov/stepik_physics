- matching:
    question:
      types: matching
      text_data: 'Сопоставьте физическую ситуацию с изменением момента импульса (относительно
        закреплённой оси):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Гимнаст во время прыжка группируется (прижимает руки и ноги к телу)
      - Гимнаст перед приземлением разгруппировывается
      - Вращающийся волчок, на который не действуют моменты внешних сил
      - К колесу обозрения приложили тормозящий момент силы
      - Человек стоит на вращающейся платформе, держа в руках гантели (опускает руки)
      second:
      - Момент инерции уменьшается, угловая скорость возрастает (L = const)
      - Момент инерции возрастает, угловая скорость падает
      - Момент импульса сохраняется по модулю и направлению (прецессия – отдельная
        тема)
      - Момент импульса уменьшается (M ≠ 0)
      - Момент инерции уменьшается, угловая скорость увеличивается (человек начинает
        вращаться быстрее)
