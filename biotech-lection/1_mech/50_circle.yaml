- choice:
    question:
      types: choice
      text_data: 'Момент импульса твёрдого тела, вращающегося вокруг неподвижной оси,
        может быть вычислен как:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $L = I·ω$
      - $L = ∫ [r × v] dm$
      - $L_z = I_z·ω_z$ (проекция на ось)
      wrong:
      - $L = m·v·R$ (только для материальной точки)
      - $L = F·t$
      - $L = M·Δt$
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте физическую величину (для вращательного движения) с её
        формулой (для материальной точки, движущейся по окружности):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Момент импульса L (относительно центра)
      - Момент силы M (относительно центра)
      - Момент инерции I (материальной точки)
      - Кинетическая энергия вращения E_кин_вращ
      - Связь линейного и углового ускорений
      second:
      - $L = m·v·R = m·R²·ω$
      - $M = F·R$ (при F ⊥ R)
      - $I = m·R²$
      - $E_{кин} = (I·ω²)/2 = (m·v²)/2$ (для точки – одно и то же)
      - $a_{тан} = ε·R$, $a_{цс} = ω²·R$
- matching:
    question:
