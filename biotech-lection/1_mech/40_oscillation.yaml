- choice:
    question:
      types: choice
      text_data: Какие движения относятся к механическим колебаниям?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - движения, обладающие той или иной степенью повторяемости во времени
      - движения, при которых тело отклоняется от положения равновесия и возвращается
        обратно (периодически или почти периодически)
      wrong:
      - только строго периодические движения с постоянной амплитудой
      - любые движения по окружности
      - только движения под действием силы тяжести
- choice:
    question:
      types: choice
      text_data: Какие колебания называются свободными?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - колебания, происходящие в системе под действием внутренних сил после того,
        как система была выведена из равновесия и предоставлена самой себе
      - колебания без внешнего периодического воздействия
      wrong:
      - колебания, происходящие только под действием внешней периодической силы
      - колебания в вакууме
      - колебания с постоянной амплитудой
- choice:
    question:
      types: choice
      text_data: Какие из перечисленных систем являются физическими маятниками?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - твёрдое тело, совершающее колебания под действием силы тяжести относительно
        горизонтальной оси, не проходящей через центр масс
      - однородный стержень, подвешенный за один конец
      - металлическое кольцо на гвозде
      wrong:
      - груз на невесомой нерастяжимой нити (математический маятник)
      - пружина с грузом (пружинный маятник)
      - тело, скользящее без трения по наклонной плоскости
- choice:
    question:
      types: choice
      text_data: Какие величины характеризуют затухание колебаний?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - коэффициент затухания $β$
      - логарифмический декремент затухания
      - время релаксации $τ$
      wrong:
      - циклическая частота $ω_0$ (собственная частота без затухания)
      - амплитуда
      - начальная фаза
- choice:
    question:
      types: choice
      text_data: Что происходит при механическом резонансе?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - резкое возрастание амплитуды вынужденных колебаний при приближении частоты
        внешней силы к собственной частоте системы
      - совпадение частоты вынуждающей силы с собственной частотой колебаний системы
      wrong:
      - уменьшение амплитуды колебаний до нуля
      - прекращение любых колебаний
      - увеличение частоты собственных колебаний
- choice:
    question:
      types: choice
      text_data: Какие колебания являются гармоническими?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - колебания, при которых колеблющаяся величина изменяется во времени по закону
        синуса или косинуса
      - $x(t) = A * cos(ωt + φ_0)$
      - колебания с одной определённой частотой (в спектре – одна линия)
      wrong:
      - любые периодические колебания
      - колебания с постоянной амплитудой (в том числе несинусоидальные)
      - только свободные незатухающие колебания (строго говоря, да, но вынужденные
        без затухания тоже могут быть гармоническими)
- choice:
    question:
      types: choice
      text_data: Как связаны между собой период T, циклическая частота ω и обычная
        частота $\nu$?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $ω = 2π / T$
      - $ω = 2π\nu$
      - $T = 1/\nu$
      wrong:
      - $ω = T / 2π$
      - $ω = \nu / 2π$
      - $T = ω * 2π$
- choice:
    question:
      types: choice
      text_data: Что называется амплитудой колебаний?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - максимальное отклонение колеблющейся величины от положения равновесия (по
        модулю)
      - положительная постоянная A в уравнении $x = A*cos(ωt+φ0)$
      wrong:
      - размах колебаний (удвоенная амплитуда)
      - величина, обратная частоте
      - путь, пройденный за один период
- choice:
    question:
      types: choice
      text_data: Какие утверждения о времени релаксации $τ$ верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - это время, за которое амплитуда затухающих колебаний уменьшается в e раз (≈
        в 2,718 раза)
      - $τ = 1/β$, где β – коэффициент затухания
      - чем больше τ, тем медленнее затухают колебания
      wrong:
      - τ – это время полной остановки колебаний
      - τ не зависит от коэффициента затухания
      - τ – это период затухающих колебаний
- choice:
    question:
      types: choice
      text_data: 'Логарифмический декремент затухания λ – это:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - натуральный логарифм отношения двух последовательных амплитуд, отстоящих на
        период
      - $λ = β * T$
      - $λ = ln(A(t)/A(t+T))$
      wrong:
      - $λ = A(t) - A(t+T)$
      - $λ = 1/τ$
      - $λ = ω_0 * T$
