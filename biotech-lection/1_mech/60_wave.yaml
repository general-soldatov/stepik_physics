- choice:
    question:
      types: choice
      text_data: Какие волны относятся к механическим (упругим) волнам?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - волны, распространяющиеся в упругой среде (твёрдой, жидкой или газообразной)
      - звуковые волны
      - сейсмические волны
      - волны на поверхности воды
      wrong:
      - радиоволны (электромагнитные)
      - световые волны
      - рентгеновское излучение
- choice:
    question:
      types: choice
      text_data: Какие утверждения об источниках волн верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - источником волн является колеблющееся тело
      - источник передаёт энергию частицам среды, которые начинают колебаться
      - частота волны равна частоте колебаний источника (при отсутствии эффекта Доплера
        для неподвижного источника)
      wrong:
      - источник волн всегда движется со скоростью волны
      - источник создаёт вещество
      - источник волн неподвижен относительно Земли
- choice:
    question:
      types: choice
      text_data: Какими признаками характеризуются плоская и сферическая волны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - у плоской волны волновые поверхности — плоскости
      - у сферической волны волновые поверхности — концентрические сферы
      - амплитуда плоской волны не зависит от расстояния до источника (в идеальной
        среде без поглощения)
      - амплитуда сферической волны убывает обратно пропорционально расстоянию от
        источника
      wrong:
      - плоская волна всегда одномерна
      - сферическая волна не может быть поперечной
      - амплитуда плоской волны убывает как 1/r
- choice:
    question:
      types: choice
      text_data: Что называется длиной волны λ?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - расстояние, на которое распространяется волна за время, равное периоду колебаний
      - расстояние между двумя ближайшими точками, колеблющимися в одинаковой фазе
      - $λ = v / ν = v * T$
      wrong:
      - амплитуда колебаний частиц
      - расстояние между гребнем и впадиной
      - максимальное смещение частиц
- choice:
    question:
      types: choice
      text_data: Какие соотношения связывают волновое число k с другими характеристиками
        волны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $k = 2π / λ$ (циклическое волновое число)
      - $k = ω / v$ (где ω — циклическая частота, v — фазовая скорость)
      - $k = 2πν / v$
      wrong:
      - $k = λ / 2π$
      - $k = v / ω$
      - $k = λ * ν$
- choice:
    question:
      types: choice
      text_data: Какие условия необходимы для возникновения интерференции волн?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - волны должны быть когерентными (иметь постоянную разность фаз во времени)
      - волны должны иметь одинаковую (или близкую) частоту
      - волны должны встречаться в пространстве (накладываться друг на друга)
      wrong:
      - волны обязательно должны быть поперечными
      - волны должны распространяться в разных средах
      - амплитуды волн должны быть строго равны
- choice:
    question:
      types: choice
      text_data: Какое условие соответствует интерференционному максимуму (усилению)
        при наложении двух когерентных волн?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - $Δd = k·λ$ (разность хода равна целому числу длин волн, k = 0, ±1, ±2, ...)
      - $Δφ = 2π·k$ (разность фаз кратна 2π)
      wrong:
      - $Δd = (2k+1)·λ/2$ (полуцелое число длин волн)
      - $Δφ = π·(2k+1)$
      - $Δd = k·λ/2$
- choice:
    question:
      types: choice
      text_data: Что характеризует стоячая волна?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - образуется при наложении двух встречных когерентных волн одинаковой частоты
        и амплитуды
      - имеет узлы (точки, где амплитуда всегда равна нулю) и пучности (точки с максимальной
        амплитудой)
      - энергия в стоячей волне не переносится, а перераспределяется между кинетической
        и потенциальной
      wrong:
      - все точки стоячей волны колеблются с одинаковой амплитудой
      - стоячая волна переносит энергию от источника к приёмнику
      - узлы смещены относительно друг друга на λ/4
- choice:
    question:
      types: choice
      text_data: Что называется дифракцией волн?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - огибание волнами препятствий
      - отклонение волн от прямолинейного распространения, особенно заметное, когда
        размер препятствия сравним с длиной волны
      - проникновение волн в область геометрической тени
      wrong:
      - сложение волн в пространстве
      - отражение волн от границы раздела сред
      - преломление волн
- choice:
    question:
      types: choice
      text_data: 'Принцип Гюйгенса гласит:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - каждая точка среды, до которой дошла волна, становится источником вторичных
        сферических (элементарных) волн
      - фронт волны в следующий момент времени есть огибающая всех вторичных волн
      wrong:
      - волна распространяется только по прямой линии
      - энергия волны пропорциональна квадрату амплитуды
      - волны не могут огибать препятствия
