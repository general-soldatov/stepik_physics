        wrong: ''
      first:
      - $Δd = k·λ$ (k = 0, 1, 2, ...)
      - $Δd = (2k+1)·λ/2$ (k = 0, 1, 2, ...)
      - $Δφ = 2π·k$
      - $Δφ = (2k+1)·π$
