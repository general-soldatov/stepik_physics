- choice:
    question:
      types: choice
      text_data: 'При равноускоренном движении:'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - скорость изменяется линейно со временем
      - ускорение постоянно по модулю и направлению
      - перемещение пропорционально квадрату времени (при нулевой начальной скорости)
      wrong:
      - скорость всегда возрастает
      - ускорение всегда направлено против скорости
      - траектория может быть только прямой
- choice:
    question:
      types: choice
      text_data: Какие утверждения о мгновенной скорости верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Это скорость тела в данный момент времени
      - Она равна первой производной радиус-вектора по времени
      - Она направлена по касательной к траектории
      wrong:
      - Она всегда равна средней скорости
      - Она всегда больше средней скорости
      - Она не зависит от выбора системы отсчёта
- choice:
    question:
      types: choice
      text_data: Что характеризует частота обращения?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Число полных оборотов за единицу времени
      - Величина, обратная периоду
      wrong:
      - Угол поворота за единицу времени
      - Время одного полного оборота
      - Длина дуги за единицу времени
- choice:
    question:
      types: choice
      text_data: Что такое радиан?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Единица измерения плоского угла
      - Угол, соответствующий дуге, длина которой равна радиусу окружности
      - 1 рад ≈ 57,3°
      wrong:
      - Единица измерения частоты вращения
      - Радиус, выраженный в метрах
      - Угол в 1 градус
- choice:
    question:
      types: choice
      text_data: Какие из кинематических уравнений описывают равноускоренное движение
        вдоль оси X?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - x(t) = x0 + v0x*t + (ax*t^2)/2
      - vx(t) = v0x + ax*t
      wrong:
      - x(t) = A*sin(ωt + φ)
      - v = const
      - x(t) = x0 + v*t
- choice:
    question:
      types: choice
      text_data: Какие утверждения о средней скорости перемещения верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Она равна отношению вектора перемещения ко времени движения
      - Может быть равна нулю, даже если тело прошло большой путь (вернулось в исходную
        точку)
      wrong:
      - Она всегда равна модулю мгновенной скорости
      - Она всегда больше средней путевой скорости
      - 'Она не зависит от формы траектории – только от начальной и конечной точек
        (верно, но пояснение: именно это и есть её определение)'
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте физическую величину с её определением (для поступательного
        движения):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Перемещение
      - Траектория
      - Путь
      - Материальная точка
      - Система отсчёта
      second:
      - Вектор, соединяющий начальное и конечное положение тела
      - Линия, которую описывает тело в пространстве при своём движении
      - Скалярная величина, равная длине участка траектории между начальной и конечной
        точками
      - Тело, размерами которого в данной задаче можно пренебречь
      - Совокупность тела отсчёта, связанной с ним системы координат и прибора для
        измерения времени
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте вид движения с его графиком скорости v(t) (словесное
        описание):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Равномерное прямолинейное
      - Равноускоренное с ненулевой начальной скоростью (ускорение положительное)
      - Равнозамедленное (ускорение отрицательное)
      - Тело покоится
      - Равноускоренное из состояния покоя
      second:
      - Горизонтальная прямая (v = const)
      - Прямая, идущая из точки v0 > 0 на оси v, наклонённая вверх (v растёт со временем)
      - Прямая, идущая из точки v0 > 0, наклонённая вниз (v убывает со временем до
        нуля или отрицательных значений)
      - Прямая, совпадающая с осью времени (v = 0)
      - Прямая, выходящая из начала координат (v0 = 0) и идущая вверх
- matching:
    question:
      types: matching
      text_data: 'Сопоставьте формулу из кинематики с её названием или смыслом (для
        одномерного равноускоренного движения, вдоль оси x):'
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - v_x = v_{0x} + a_x t
      - x = x_0 + v_{0x} t + \frac{a_x t^2}{2}
      - v_x^2 - v_{0x}^2 = 2a_x (x - x_0)
      - \vec{v}_{ср} = \frac{\vec{\Delta r}}{\Delta t}
      - a = \frac{\Delta v}{\Delta t}
      second:
      - Уравнение скорости
      - Кинематическое уравнение координаты
      - Формула без времени (связь скорости, ускорения и перемещения)
      - Определение средней скорости перемещения
      - Определение (среднего) ускорения
