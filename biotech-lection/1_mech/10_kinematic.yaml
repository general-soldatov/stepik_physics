- choice:
    question:
      types: choice
      text_data: Что изучает кинематика?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - движение тел без учёта причин, вызывающих это движение
      wrong:
      - взаимодействие тел
      - силы, действующие на тело
      - тепловые явления
      - электрические поля
- choice:
    question:
      types: choice
      text_data: Какие из перечисленных объектов НЕЛЬЗЯ считать материальной точкой
        в данной задаче?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - поезд, въезжающий на станцию (при расчёте времени его полной остановки)
      - человек, переходящий дорогу (при расчёте времени перехода)
      - спутник Земли (при расчёте периода его обращения)
      wrong:
      - Земля при расчёте её орбиты вокруг Солнца
      - самолёт при перелёте из Москвы в Новосибирск
      - теннисный мяч при ударе (если нас интересует только время его полёта от ракетки
        до корта)
- choice:
    question:
      types: choice
      text_data: Какое из следующих утверждений о механическом движении верно?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - Тело движется относительно одних тел и покоится относительно других
      - Движение тела зависит от выбора системы отсчёта
      - Одно и то же тело может одновременно двигаться и покоиться (относительно разных
        систем отсчёта)
      wrong:
      - Существует абсолютная система отсчёта, неподвижная относительно всего мира
      - Движение тела не зависит от выбора системы отсчёта
      - Если тело движется относительно Земли, то оно движется и относительно любых
        других тел
