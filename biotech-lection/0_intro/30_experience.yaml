      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      first:
      - Материальная точка
      - Идеальный газ
      - Абсолютно твёрдое тело
      - Сплошная среда
      - Модель идеального проводника
      second:
      - Размеры тела много меньше характерных расстояний задачи
      - Давление не слишком высокое, температура не слишком низкая (не близка к сжижению)
      - Деформации пренебрежимо малы по сравнению с размерами тела
      - Характерный размер (длина волны, пробег) много больше межатомных расстояний
      - Отсутствие сопротивления (например, для сверхпроводников или в задачах без
        нагрева)
