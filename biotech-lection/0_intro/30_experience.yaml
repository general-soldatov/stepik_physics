      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - идеальный газ
      wrong:
      - реальный газ
      - плазма
      - жидкость
- choice:
    question:
      types: choice
      text_data: Какие утверждения о физических моделях верны?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - одна и та же модель может применяться к разным объектам
      - один объект может описываться разными моделями в зависимости от задачи
      - модель всегда является приближением и имеет границы применимости
      - модели могут быть материальными и мысленными
      wrong:
      - модель должна точно отражать все свойства объекта
      - модель не может быть математической
      - модели не требуют экспериментальной проверки
- choice:
    question:
      types: choice
      text_data: Что такое математическая модель в физике?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - описание объекта или явления на языке математических уравнений, неравенств,
        функций
      - система формул, позволяющая рассчитывать параметры системы
      - например, $F = m·a$, закон Ома, уравнения Максвелла
      wrong:
      - макет прибора
      - рисунок экспериментальной установки
      - словесное описание
- choice:
