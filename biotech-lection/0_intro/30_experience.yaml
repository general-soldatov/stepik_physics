        correct: ''
        wrong: ''
      first:
      - Материальная точка
      - Абсолютно твёрдое тело
      - Идеальный газ
      - Идеальная жидкость
      - Абсолютно чёрное тело
      second:
      - Тело, размерами которого можно пренебречь в данной задаче
      - Тело, деформациями которого можно пренебречь (расстояния между точками не
        меняются)
      - Газ, молекулы которого — материальные точки, не взаимодействуют, кроме абсолютно
        упругих ударов
      - Жидкость без вязкости (трения между слоями) и несжимаемая
      - Тело, поглощающее всё падающее на него излучение любой длины волны
