- choice:
    question:
      types: choice
      text_data: Что называется моделью в физике?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - упрощённое представление реального объекта, явления или процесса, сохраняющее
        его существенные свойства
      - мысленно или материально реализованная система, которая замещает и воспроизводит
        изучаемый объект
      - инструмент для объяснения и предсказания физических явлений
      wrong:
      - точная копия реального объекта во всех деталях
      - только математическое уравнение
      - реальный эксперимент
