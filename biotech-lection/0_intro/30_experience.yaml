      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - абсолютно чёрное тело
      - идеальная жидкость
      - абсолютно упругое тело
      - несжимаемая жидкость
      wrong:
      - резиновый мяч
      - вода из-под крана
      - реальный пружинный маятник
- choice:
    question:
      types: choice
      text_data: Почему физика использует модели вместо изучения реальных объектов
        напрямую?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - реальные объекты часто слишком сложны для полного описания
      - модели позволяют выделить главное и отбросить второстепенное
      - эксперименты с моделями могут быть безопаснее и дешевле
      - модели позволяют делать предсказания в рамках теории
      wrong:
      - модели точнее отражают реальность
      - реальные объекты не подчиняются законам физики
      - модели не требуют проверки
- choice:
    question:
      types: choice
      text_data: Что происходит с моделью, когда накапливаются факты, противоречащие
        её предсказаниям?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - модель уточняется, расширяются границы её применимости
      - модель заменяется на более совершенную
      - модель признаётся неверной в данной области и отвергается (если не подлежит
        исправлению)
      wrong:
      - модель сохраняется, а факты игнорируются
      - модель усложняется произвольным образом
      - модель перестаёт использоваться навсегда
- matching:
