      text_data: Что является предметом физики?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - материя в виде вещества и поля
      - фундаментальные взаимодействия (сильное, электромагнитное, слабое, гравитационное)
      - пространство и время как формы существования материи
      - наиболее общие закономерности явлений природы
