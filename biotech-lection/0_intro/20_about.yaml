- choice:
    question:
      types: choice
      text_data: Какова основная цель физики как науки?
      code_path: null
      image: null
      help: null
    answer:
      sample_size: null
      feedback:
        correct: ''
        wrong: ''
      correct:
      - изучение наиболее общих законов природы, строения и эволюции материи
      - выявление причинно-следственных связей между явлениями и создание физических
        теорий
      - описание, объяснение и предсказание физических явлений
      wrong:
      - только описание экспериментальных данных
      - создание технических устройств
      - изучение только механического движения
- choice:
